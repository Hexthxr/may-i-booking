openapi: 3.0.3
info:
  title: May i Booking API
  version: 1.0.0
  description: >
    REST API for May i Booking (online bookstore).  
    รองรับ role: guest / user / admin ตาม JWT (Bearer token)

servers:
  - url: http://localhost:4000
    description: Local dev server

tags:
  - name: Auth
    description: ลงทะเบียน / ล็อกอิน
  - name: Users
    description: โปรไฟล์ผู้ใช้ / avatar / favorites
  - name: Books
    description: จัดการหนังสือ + ค้นหา
  - name: Reviews
    description: รีวิว + rating ของหนังสือ
  - name: Cart
    description: ตะกร้าสินค้า
  - name: Addresses
    description: สมุดที่อยู่จัดส่ง
  - name: Orders
    description: การสั่งซื้อสำหรับผู้ใช้
  - name: Admin
    description: การจัดการของ admin (หนังสือ / ออเดอร์)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
      additionalProperties: true

    # ---------- Auth ----------
    User:
      type: object
      properties:
        _id:
          type: string
          description: MongoDB id
        id:
          type: string
          description: >
            id แบบสั้นที่บาง endpoint ใช้คืนมา (เช่นใน AuthResponse)
        username:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
          description: ชื่อไว้โชว์ในหน้าเว็บ
        role:
          type: string
          enum: [user, admin]
        favorites:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          description: ชื่อผู้ใช้ (ใช้ล็อกอินได้)
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        displayName:
          type: string
        adminCode:
          type: string
          description: >
            ถ้าใส่โค้ดถูกต้อง backend จะ set role = admin (ตามโค้ด createAdmin)

    LoginRequest:
      type: object
      required:
        - usernameOrEmail
        - password
      properties:
        usernameOrEmail:
          type: string
          description: ใส่ได้ทั้ง username หรือ email (backend ใช้ field นี้ค้นหา)
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT token
        user:
          type: object
          properties:
            id:
              type: string
            username:
              type: string
            email:
              type: string
              format: email
            displayName:
              type: string
            role:
              type: string
              enum: [user, admin]

    # ---------- Books ----------
    Book:
      type: object
      properties:
        _id:
          type: string
        title:
          type: string
        authors:
          type: array
          items:
            type: string
        category:
          type: string
          description: หมวดหมู่ภาษาไทย เช่น การเรียน, การเงินการลงทุน, มังงะ
        price:
          type: number
          format: float
        stock:
          type: integer
        description:
          type: string
        isActive:
          type: boolean
        avgRating:
          type: number
          format: float
        ratingCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BookCreateRequest:
      type: object
      required:
        - title
        - price
        - stock
      properties:
        title:
          type: string
        authors:
          type: array
          items:
            type: string
        category:
          type: string
        price:
          type: number
          format: float
        stock:
          type: integer
        description:
          type: string
        isActive:
          type: boolean

    # ---------- Reviews ----------
    Review:
      type: object
      properties:
        _id:
          type: string
        bookId:
          type: string
        userId:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ReviewCreateRequest:
      type: object
      required:
        - rating
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string

    RatingSummary:
      type: object
      properties:
        avg:
          type: number
          format: float
        count:
          type: integer

    # ---------- Cart ----------
    CartItem:
      type: object
      properties:
        bookId:
          type: string
        title:
          type: string
        price:
          type: number
          format: float
        qty:
          type: integer
      required:
        - bookId
        - qty

    Cart:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        updatedAt:
          type: string
          format: date-time

    CartSyncRequest:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              bookId:
                type: string
              qty:
                type: integer
            required:
              - bookId
              - qty

    CartAddItemRequest:
      type: object
      required:
        - bookId
      properties:
        bookId:
          type: string
        qty:
          type: integer
          default: 1

    CartRemoveItemRequest:
      type: object
      required:
        - bookId
      properties:
        bookId:
          type: string

    CartUpdateQtyRequest:
      type: object
      required:
        - bookId
        - qty
      properties:
        bookId:
          type: string
        qty:
          type: integer

    # ---------- Addresses ----------
    Address:
      type: object
      properties:
        _id:
          type: string
        userId:
          type: string
        fullName:
          type: string
        phone:
          type: string
        line1:
          type: string
        line2:
          type: string
        subdistrict:
          type: string
        district:
          type: string
        province:
          type: string
        postcode:
          type: string
        isDefault:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AddressCreateRequest:
      type: object
      required:
        - fullName
        - phone
        - line1
        - subdistrict
        - district
        - province
        - postcode
      properties:
        fullName:
          type: string
        phone:
          type: string
        line1:
          type: string
        line2:
          type: string
        subdistrict:
          type: string
        district:
          type: string
        province:
          type: string
        postcode:
          type: string
        isDefault:
          type: boolean

    # ---------- Orders ----------
    OrderItem:
      type: object
      properties:
        bookId:
          type: string
        title:
          type: string
        price:
          type: number
          format: float
        qty:
          type: integer
      required:
        - bookId
        - title
        - price
        - qty

    OrderStatus:
      type: string
      enum:
        - PENDING
        - PAID
        - PROCESSING
        - SHIPPED
        - COMPLETED
        - CANCELLED

    PaymentMethod:
      type: string
      enum:
        - COD
        - TRANSFER

    Order:
      type: object
      properties:
        _id:
          type: string
        userId:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        address:
          $ref: '#/components/schemas/Address'
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        status:
          $ref: '#/components/schemas/OrderStatus'
        subtotal:
          type: number
          format: float
        shippingFee:
          type: number
          format: float
        discount:
          type: number
          format: float
        total:
          type: number
          format: float
        slipUploaded:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OrderCreateRequest:
      type: object
      properties:
        addressId:
          type: string
          description: ใช้ที่อยู่ที่บันทึกไว้
        shippingAddress:
          $ref: '#/components/schemas/AddressCreateRequest'
        items:
          type: array
          description: ถ้าไม่ส่ง items จะใช้ cart ปัจจุบันของ user
          items:
            type: object
            properties:
              bookId:
                type: string
              qty:
                type: integer
            required:
              - bookId
              - qty
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
      required:
        - paymentMethod

    OrderStatusUpdateRequest:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/OrderStatus'
      required:
        - status

security:
  - bearerAuth: []

paths:
  # ===================== Auth =====================
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register new user
      description: สมัครสมาชิกใหม่ (guest เท่านั้น)
      security: []  # ไม่ต้องส่ง token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email/Username already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login (username or email)
      description: >
        ล็อกอินด้วย **username หรือ email** ก็ได้  
        backend ใช้ field `usernameOrEmail` หา user จาก `{ username }` หรือ `{ email }`
      security: []  # ไม่ต้องส่ง token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ===================== Users =====================
  /api/users/me:
    get:
      tags: [Users]
      summary: Get current user profile
      description: ดึงข้อมูลโปรไฟล์ของ user ปัจจุบัน
      responses:
        '200':
          description: Current user info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags: [Users]
      summary: Update current user profile
      description: แก้ไข displayName ของตัวเอง
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/users/me/favorites:
    get:
      tags: [Users]
      summary: Get favorite book IDs of current user
      responses:
        '200':
          description: Favorite list
          content:
            application/json:
              schema:
                type: object
                properties:
                  favorites:
                    type: array
                    items:
                      type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [Users]
      summary: Replace favorites of current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [favorites]
              properties:
                favorites:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Updated favorites
          content:
            application/json:
              schema:
                type: object
                properties:
                  favorites:
                    type: array
                    items:
                      type: string
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/users/me/avatar:
    post:
      tags: [Users]
      summary: Upload avatar
      description: อัพโหลดรูป avatar ของตัวเอง (image/*)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Avatar uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Invalid file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [Users]
      summary: Get current user's avatar
      description: ส่ง binary image เป็นรูป avatar
      responses:
        '200':
          description: Avatar image
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          description: Avatar not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ===================== Books =====================
  /api/books:
    get:
      tags: [Books]
      summary: List books
      description: >
        ดึงรายการหนังสือทั้งหมด (guest/user/admin ใช้ได้)  
        รองรับ filter และ pagination บางส่วน
      parameters:
        - in: query
          name: category
          schema:
            type: string
          description: Filter ตามหมวดหมู่
        - in: query
          name: q
          schema:
            type: string
          description: ค้นหาตามชื่อหนังสือ/ผู้เขียน
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: List of books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'
    post:
      tags: [Books, Admin]
      summary: Create book (admin)
      description: เพิ่มหนังสือใหม่ (เฉพาะ admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookCreateRequest'
      responses:
        '201':
          description: Book created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (not admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/books/recommended:
    get:
      tags: [Books]
      summary: Get recommended books
      responses:
        '200':
          description: Recommended books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'

  /api/books/top-rated:
    get:
      tags: [Books]
      summary: Get top rated books
      responses:
        '200':
          description: Top rated books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'

  /api/books/best-sellers:
    get:
      tags: [Books]
      summary: Get best seller books
      responses:
        '200':
          description: Best seller books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'

  /api/books/{id}:
    get:
      tags: [Books]
      summary: Get book by id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Book details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '404':
          description: Book not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [Books, Admin]
      summary: Update book (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookCreateRequest'
      responses:
        '200':
          description: Updated book
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (not admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Book not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Books, Admin]
      summary: Delete book (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
        '403':
          description: Forbidden (not admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Book not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/books/{id}/cover:
    get:
      tags: [Books]
      summary: Get book cover
      description: ส่ง binary image เป็นรูปปกหนังสือ
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cover image
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          description: Cover not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ===================== Reviews =====================
  /api/books/{bookId}/reviews:
    get:
      tags: [Reviews]
      summary: Get reviews for a book
      parameters:
        - in: path
          name: bookId
          required: true
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: List of reviews
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Review'
        '404':
          description: Book not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Reviews]
      summary: Create or update review for this book by current user
      parameters:
        - in: path
          name: bookId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreateRequest'
      responses:
        '200':
          description: Review created/updated + updated stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  stats:
                    $ref: '#/components/schemas/RatingSummary'
        '400':
          description: Validation error (rating 1-5)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Book not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/books/{bookId}/reviews/rating:
    get:
      tags: [Reviews]
      summary: Get rating summary of a book
      parameters:
        - in: path
          name: bookId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Rating summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingSummary'
        '404':
          description: Book not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/books/{bookId}/reviews/me:
    delete:
      tags: [Reviews]
      summary: Delete current user's review for a book
      parameters:
        - in: path
          name: bookId
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted or nothing to delete
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ===================== Cart =====================
  /api/cart:
    get:
      tags: [Cart]
      summary: Get current user's cart
      responses:
        '200':
          description: Cart data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Cart]
      summary: Sync cart items (replace)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartSyncRequest'
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Cart]
      summary: Clear cart
      responses:
        '204':
          description: Cart cleared
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
