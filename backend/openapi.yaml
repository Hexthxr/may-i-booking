openapi: 3.0.3
info:
  title: May i Booking API
  version: 1.0.0
  description: >
    OpenAPI spec for May i Booking project.
    NOTE: This is a draft structure. Please fill in request/response schemas and examples.

servers:
  - url: http://localhost:4000
    description: Local development server

tags:
  - name: Auth
    description: Authentication and authorization endpoints
  - name: Users
    description: User profile and favorites
  - name: Books
    description: Book catalog and admin book management
  - name: Reviews
    description: Book reviews and ratings
  - name: Cart
    description: Shopping cart for users
  - name: Addresses
    description: User address book
  - name: Orders
    description: Order placement and management

  # --- Role-based tags ---
  - name: Guest
    description: Public endpoints that don't require login
  - name: User
    description: Endpoints for logged-in users (user or admin)
  - name: Admin
    description: Endpoints that require admin role

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        _id:
          type: string
        username:
          type: string
        email:
          type: string
        fullname:
          type: string
        role:
          type: string
          enum: [user, admin]
        favorites:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Book:
      type: object
      properties:
        _id:
          type: string
        title:
          type: string
        authors:
          type: array
          items:
            type: string
        category:
          type: string
        price:
          type: number
        stock:
          type: integer
        description:
          type: string
        avgRating:
          type: number
        ratingCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Review:
      type: object
      properties:
        _id:
          type: string
        user:
          $ref: '#/components/schemas/User'
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CartItem:
      type: object
      properties:
        book:
          $ref: '#/components/schemas/Book'
        bookId:
          type: string
          description: Book ID (for write operations)
        qty:
          type: integer
          minimum: 1

    Address:
      type: object
      properties:
        _id:
          type: string
        label:
          type: string
        fullName:
          type: string
        phone:
          type: string
        line1:
          type: string
        line2:
          type: string
        district:
          type: string
        province:
          type: string
        postalCode:
          type: string
        isDefault:
          type: boolean

    OrderItem:
      type: object
      properties:
        book:
          $ref: '#/components/schemas/Book'
        qty:
          type: integer
        price:
          type: number
        subtotal:
          type: number

    Order:
      type: object
      properties:
        _id:
          type: string
        user:
          $ref: '#/components/schemas/User'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        address:
          $ref: '#/components/schemas/Address'
        status:
          type: string
          enum: [PENDING, PAID, PROCESSING, SHIPPED, COMPLETED, CANCELLED]
        paymentMethod:
          type: string
          enum: [COD, TRANSFER]
        totalItems:
          type: integer
        totalAmount:
          type: number
        slipUploaded:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

paths:

  ################################
  #           AUTH               #
  ################################

  /api/auth/register:
    post:
      tags: [Auth, Guest]
      summary: Register a new user
      x-roles: [guest]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                fullname:
                  type: string
                adminCode:
                  type: string
                  description: Optional. If correct, user will be created as admin.
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Validation error or duplicate user

  /api/auth/login:
    post:
      tags: [Auth, Guest]
      summary: Login with username or email and password
      x-roles: [guest]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                usernameOrEmail:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT token
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials

  ################################
  #           USERS              #
  ################################

  /api/users/me:
    get:
      tags: [Users, User]
      summary: Get current user profile
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized

    patch:
      tags: [Users, User]
      summary: Update current user profile
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Partial user fields to update
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Validation error
        '401':
          description: Unauthorized

  /api/users/me/avatar:
    post:
      tags: [Users, User]
      summary: Upload avatar for current user
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        '200':
          description: Avatar uploaded successfully
        '400':
          description: Invalid file or upload error
        '401':
          description: Unauthorized

    get:
      tags: [Users, User]
      summary: Get current user avatar image
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      responses:
        '200':
          description: Avatar image
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          description: Avatar not found

  /api/users/me/favorites:
    get:
      tags: [Users, User]
      summary: Get favorite books of current user
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      responses:
        '200':
          description: List of favorite book IDs or books
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '401':
          description: Unauthorized

    put:
      tags: [Users, User]
      summary: Replace favorite books list
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                favorites:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Updated favorites
        '400':
          description: Validation error
        '401':
          description: Unauthorized

  ################################
  #           BOOKS              #
  ################################

  /api/books:
    get:
      tags: [Books, Guest, User, Admin]
      summary: Get list of books
      x-roles: [guest, user, admin]
      parameters:
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: q
          schema:
            type: string
            description: Search keyword
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        '200':
          description: List of books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'

    post:
      tags: [Books, Admin]
      summary: Create a new book (admin only)
      security:
        - BearerAuth: []
      x-roles: [admin]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  type: string
                  description: JSON string for book data (title, price, etc.)
                cover:
                  type: string
                  format: binary
      responses:
        '201':
          description: Book created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (not admin)

  /api/books/{id}:
    get:
      tags: [Books, Guest, User, Admin]
      summary: Get book detail
      x-roles: [guest, user, admin]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Book detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '404':
          description: Book not found

    put:
      tags: [Books, Admin]
      summary: Update a book (admin only)
      security:
        - BearerAuth: []
      x-roles: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  type: string
                  description: JSON string for book data
                cover:
                  type: string
                  format: binary
                  description: Optional new cover
      responses:
        '200':
          description: Updated book
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Book not found

    delete:
      tags: [Books, Admin]
      summary: Delete a book (admin only)
      security:
        - BearerAuth: []
      x-roles: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Book deleted
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Book not found

  /api/books/{id}/cover:
    get:
      tags: [Books, Guest, User, Admin]
      summary: Get book cover image
      x-roles: [guest, user, admin]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Book cover image
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          description: Cover not found

  /api/books/recommended:
    get:
      tags: [Books, Guest, User, Admin]
      summary: Get recommended books
      x-roles: [guest, user, admin]
      responses:
        '200':
          description: List of recommended books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'

  /api/books/top-rated:
    get:
      tags: [Books, Guest, User, Admin]
      summary: Get top-rated books
      x-roles: [guest, user, admin]
      responses:
        '200':
          description: List of top-rated books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'

  /api/books/best-sellers:
    get:
      tags: [Books, Guest, User, Admin]
      summary: Get best-seller books
      x-roles: [guest, user, admin]
      responses:
        '200':
          description: List of best sellers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'

  ################################
  #           REVIEWS            #
  ################################

  /api/books/{bookId}/reviews:
    get:
      tags: [Reviews, Guest, User, Admin]
      summary: Get reviews for a book
      x-roles: [guest, user, admin]
      parameters:
        - in: path
          name: bookId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Review'

    post:
      tags: [Reviews, User]
      summary: Create or update review for this book by current user
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      parameters:
        - in: path
          name: bookId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                comment:
                  type: string
      responses:
        '200':
          description: Review created or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          description: Validation error
        '401':
          description: Unauthorized

  /api/books/{bookId}/reviews/rating:
    get:
      tags: [Reviews, Guest, User, Admin]
      summary: Get rating summary for a book
      x-roles: [guest, user, admin]
      parameters:
        - in: path
          name: bookId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Rating summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  avgRating:
                    type: number
                  ratingCount:
                    type: integer

  /api/books/{bookId}/reviews/me:
    delete:
      tags: [Reviews, User]
      summary: Delete current user's review for this book
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      parameters:
        - in: path
          name: bookId
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Review deleted
        '401':
          description: Unauthorized
        '404':
          description: Review not found

  ################################
  #           CART               #
  ################################

  /api/cart:
    get:
      tags: [Cart, User]
      summary: Get current user's cart
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      responses:
        '200':
          description: Current cart
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CartItem'
        '401':
          description: Unauthorized

    post:
      tags: [Cart, User]
      summary: Sync entire cart items
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/CartItem'
      responses:
        '200':
          description: Cart synced
        '400':
          description: Validation error
        '401':
          description: Unauthorized

    delete:
      tags: [Cart, User]
      summary: Clear cart
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      responses:
        '204':
          description: Cart cleared
        '401':
          description: Unauthorized

  /api/cart/items:
    post:
      tags: [Cart, User]
      summary: Add an item to cart
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bookId:
                  type: string
                qty:
                  type: integer
      responses:
        '200':
          description: Item added to cart
        '400':
          description: Validation error
        '401':
          description: Unauthorized

    delete:
      tags: [Cart, User]
      summary: Remove an item from cart
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bookId:
                  type: string
      responses:
        '204':
          description: Item removed
        '400':
          description: Validation error
        '401':
          description: Unauthorized

  /api/cart/qty:
    put:
      tags: [Cart, User]
      summary: Update quantity of an item in cart
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bookId:
                  type: string
                qty:
                  type: integer
      responses:
        '200':
          description: Quantity updated
        '400':
          description: Validation error
        '401':
          description: Unauthorized

  ################################
  #           ADDRESSES          #
  ################################

  /api/addresses:
    get:
      tags: [Addresses, User]
      summary: Get all addresses of current user
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      responses:
        '200':
          description: List of addresses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Address'
        '401':
          description: Unauthorized

    post:
      tags: [Addresses, User]
      summary: Create new address
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Address'
      responses:
        '201':
          description: Address created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '400':
          description: Validation error or reached max addresses
        '401':
          description: Unauthorized

  /api/addresses/{id}:
    patch:
      tags: [Addresses, User]
      summary: Update an address
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Address'
      responses:
        '200':
          description: Address updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '404':
          description: Address not found

    delete:
      tags: [Addresses, User]
      summary: Delete an address
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Address deleted
        '401':
          description: Unauthorized
        '404':
          description: Address not found

  /api/addresses/{id}/default:
    patch:
      tags: [Addresses, User]
      summary: Set address as default
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Default address set
        '401':
          description: Unauthorized
        '404':
          description: Address not found

  ################################
  #           ORDERS             #
  ################################

  /api/orders:
    post:
      tags: [Orders, User]
      summary: Create a new order
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >
                Payload for creating an order.
                Should include items, addressId, paymentMethod, and optional slip info.
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Validation error or stock problem
        '401':
          description: Unauthorized

    get:
      tags: [Orders, User]
      summary: Get orders of current user
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      responses:
        '200':
          description: List of user's orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '401':
          description: Unauthorized

  /api/orders/admin:
    get:
      tags: [Orders, Admin]
      summary: Get all orders (admin only)
      security:
        - BearerAuth: []
      x-roles: [admin]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: status
          schema:
            type: string
      responses:
        '200':
          description: List of all orders for admin
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /api/orders/{id}:
    get:
      tags: [Orders, User, Admin]
      summary: Get order detail
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Order not found

  /api/orders/{id}/slip:
    get:
      tags: [Orders, User, Admin]
      summary: Get payment slip image
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Payment slip image
          content:
            image/*:
              schema:
                type: string
                format: binary
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Slip not found

  /api/orders/{id}/cancel:
    patch:
      tags: [Orders, User]
      summary: Cancel an order (by owner)
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Cannot cancel in current status
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Order not found

  /api/orders/{id}/complete:
    patch:
      tags: [Orders, Admin]
      summary: Mark order as completed (admin)
      security:
        - BearerAuth: []
      x-roles: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order marked as completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Order not found

  /api/orders/{id}/reorder:
    post:
      tags: [Orders, User]
      summary: Create new order items from previous order
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Reorder created (implementation-specific response)
        '401':
