openapi: 3.0.3
info:
  title: May i Booking API
  version: 1.0.0
  description: >
    OpenAPI spec สำหรับโปรเจกต์ May i Booking
    แบ่งหมวดตาม feature (Auth, Users, Books, Reviews, Cart, Addresses, Orders)
    และใช้ tag + x-roles เพื่อบอกว่า endpoint ไหนใช้โดย Guest / User / Admin

servers:
  - url: http://localhost:4000
    description: Local development server

tags:
  - name: Auth
    description: Authentication & registration
  - name: Users
    description: ข้อมูลผู้ใช้ โปรไฟล์ avatar favorites
  - name: Books
    description: หนังสือและการจัดการโดยแอดมิน
  - name: Reviews
    description: รีวิวและเรตติ้งหนังสือ
  - name: Cart
    description: ตะกร้าสินค้า / local cart sync
  - name: Addresses
    description: ที่อยู่จัดส่งของผู้ใช้
  - name: Orders
    description: คำสั่งซื้อ จ่ายเงิน อัพโหลดสลิป

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
        code:
          type: string
      required:
        - message

    User:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [user, admin]
        fullname:
          type: string
        favorites:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        adminCode:
          type: string
          description: "ถ้าถูกต้องจะสมัครเป็น admin"
      required:
        - username
        - email
        - password

    LoginRequest:
      type: object
      properties:
        usernameOrEmail:
          type: string
          description: "ใส่ได้ทั้ง username หรือ email (ตรงกับ backend ที่ใช้ usernameOrEmail)"
        password:
          type: string
          format: password
      required:
        - usernameOrEmail
        - password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'
      required:
        - token
        - user

    UpdateProfileRequest:
      type: object
      properties:
        fullname:
          type: string
        email:
          type: string
          format: email
      additionalProperties: false

    FavoritesUpdateRequest:
      type: object
      properties:
        favorites:
          type: array
          items:
            type: string
      required:
        - favorites

    Address:
      type: object
      properties:
        id:
          type: string
        fullName:
          type: string
        phone:
          type: string
        line1:
          type: string
        line2:
          type: string
        subdistrict:
          type: string
        district:
          type: string
        province:
          type: string
        postcode:
          type: string
        isDefault:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AddressCreateUpdateRequest:
      type: object
      properties:
        fullName:
          type: string
        phone:
          type: string
        line1:
          type: string
        line2:
          type: string
        subdistrict:
          type: string
        district:
          type: string
        province:
          type: string
        postcode:
          type: string
        isDefault:
          type: boolean
      required:
        - fullName
        - phone
        - line1
        - subdistrict
        - district
        - province
        - postcode

    Book:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        authors:
          type: array
          items:
            type: string
        category:
          type: string
        price:
          type: number
          format: float
        stock:
          type: integer
        isPreorder:
          type: boolean
        isHidden:
          type: boolean
        description:
          type: string
        avgRating:
          type: number
          format: float
        ratingCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BookCreateUpdateRequest:
      type: object
      properties:
        title:
          type: string
        authors:
          type: array
          items:
            type: string
        category:
          type: string
        price:
          type: number
          format: float
        stock:
          type: integer
        isPreorder:
          type: boolean
        isHidden:
          type: boolean
        description:
          type: string
      required:
        - title
        - category
        - price

    Review:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        bookId:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ReviewUpsertRequest:
      type: object
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
      required:
        - rating

    RatingSummary:
      type: object
      properties:
        average:
          type: number
          format: float
        count:
          type: integer

    CartItem:
      type: object
      properties:
        bookId:
          type: string
        qty:
          type: integer
        title:
          type: string
        price:
          type: number
          format: float
      required:
        - bookId
        - qty

    Cart:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        subtotal:
          type: number
          format: float
        updatedAt:
          type: string
          format: date-time

    CartSyncRequest:
      type: object
      description: "ใช้ sync local cart กับ server (front ส่ง array ของ {bookId, qty})"
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              bookId:
                type: string
              qty:
                type: integer
            required:
              - bookId
              - qty
      required:
        - items

    OrderItem:
      type: object
      properties:
        bookId:
          type: string
        title:
          type: string
        price:
          type: number
          format: float
        qty:
          type: integer
      required:
        - bookId
        - qty

    Order:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        address:
          $ref: '#/components/schemas/Address'
        paymentMethod:
          type: string
          enum: [COD, TRANSFER]
        status:
          type: string
          description: "เช่น PENDING, PAID, PROCESSING, SHIPPED, COMPLETED, CANCELLED"
        slipUrl:
          type: string
        total:
          type: number
          format: float
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OrderCreateRequest:
      type: object
      properties:
        addressId:
          type: string
        paymentMethod:
          type: string
          enum: [COD, TRANSFER]
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
      required:
        - addressId
        - paymentMethod
        - items

    OrderStatusUpdateRequest:
      type: object
      properties:
        status:
          type: string
      required:
        - status

paths:
  ################################
  #            AUTH              #
  ################################

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register new account
      x-roles: [guest]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Missing fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: User exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login with username/email and password
      x-roles: [guest]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              usernameOrEmail: "user@example.com"
              password: "123456"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  ################################
  #            USERS             #
  ################################

  /api/users/me:
    get:
      tags: [Users]
      summary: Get my profile
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized

    put:
      tags: [Users]
      summary: Update my profile
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Bad request

  /api/users/avatar:
    put:
      tags: [Users]
      summary: Upload my avatar
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        '200':
          description: Avatar updated
        '400':
          description: Invalid file

  /api/users/favorites:
    get:
      tags: [Users]
      summary: Get favorite books of current user
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      responses:
        '200':
          description: List of favorite book IDs
          content:
            application/json:
              schema:
                type: object
                properties:
                  favorites:
                    type: array
                    items:
                      type: string

    put:
      tags: [Users]
      summary: Update favorite book IDs
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FavoritesUpdateRequest'
      responses:
        '200':
          description: Updated favorites
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoritesUpdateRequest'

  /api/users/admin/list:
    get:
      tags: [Users]
      summary: List all users (admin)
      security:
        - BearerAuth: []
      x-roles: [admin]
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '403':
          description: Forbidden

  ################################
  #            ADDRESSES         #
  ################################

  /api/addresses:
    get:
      tags: [Addresses]
      summary: Get my addresses
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      responses:
        '200':
          description: List of addresses
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Address'

    post:
      tags: [Addresses]
      summary: Create new address
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressCreateUpdateRequest'
      responses:
        '201':
          description: Created address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'

  /api/addresses/{id}:
    put:
      tags: [Addresses]
      summary: Update address
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressCreateUpdateRequest'
      responses:
        '200':
          description: Updated address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'

    delete:
      tags: [Addresses]
      summary: Delete address
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted

  ################################
  #            BOOKS             #
  ################################

  /api/books:
    get:
      tags: [Books]
      summary: List books
      x-roles: [guest, user, admin]
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: page
          schema:
            type: integer
      responses:
        '200':
          description: List of books
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Book'

    post:
      tags: [Books]
      summary: Create book (admin)
      security:
        - BearerAuth: []
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookCreateUpdateRequest'
      responses:
        '201':
          description: Created book
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'

  /api/books/{id}:
    get:
      tags: [Books]
      summary: Get book detail
      x-roles: [guest, user, admin]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Book detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '404':
          description: Not found

    put:
      tags: [Books]
      summary: Update book (admin)
      security:
        - BearerAuth: []
      x-roles: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookCreateUpdateRequest'
      responses:
        '200':
          description: Updated book
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'

    delete:
      tags: [Books]
      summary: Hide/Delete book (admin)
      security:
        - BearerAuth: []
      x-roles: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted/hidden

  /api/books/{id}/cover:
    get:
      tags: [Books]
      summary: Get book cover image
      x-roles: [guest, user, admin]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Image binary
        '404':
          description: Not found

  ################################
  #           REVIEWS            #
  ################################

  /api/books/{bookId}/reviews:
    get:
      tags: [Reviews]
      summary: List reviews for a book
      x-roles: [guest, user, admin]
      parameters:
        - in: path
          name: bookId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List reviews
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Review'

    post:
      tags: [Reviews]
      summary: Create or update my review for a book
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      parameters:
        - in: path
          name: bookId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewUpsertRequest'
      responses:
        '200':
          description: Upserted review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'

  /api/books/{bookId}/reviews/rating:
    get:
      tags: [Reviews]
      summary: Get rating summary for a book
      x-roles: [guest, user, admin]
      parameters:
        - in: path
          name: bookId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Rating summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingSummary'

  /api/books/{bookId}/reviews/me:
    delete:
      tags: [Reviews]
      summary: Delete my review for a book
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      parameters:
        - in: path
          name: bookId
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted

  ################################
  #             CART             #
  ################################

  /api/cart:
    get:
      tags: [Cart]
      summary: Get my cart
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      responses:
        '200':
          description: Cart detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'

    post:
      tags: [Cart]
      summary: Sync local cart with server
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartSyncRequest'
      responses:
        '200':
          description: Synced cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'

    delete:
      tags: [Cart]
      summary: Clear my cart
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      responses:
        '200':
          description: Cart cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'

  ################################
  #            ORDERS            #
  ################################

  /api/orders:
    get:
      tags: [Orders]
      summary: List my orders
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      responses:
        '200':
          description: List of my orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'

    post:
      tags: [Orders]
      summary: Create new order from cart
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
      responses:
        '201':
          description: Created order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /api/orders/{id}:
    get:
      tags: [Orders]
      summary: Get order detail (owner or admin)
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Not found

    patch:
      tags: [Orders]
      summary: Update order status (admin)
      security:
        - BearerAuth: []
      x-roles: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusUpdateRequest'
      responses:
        '200':
          description: Order status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '403':
          description: Forbidden
        '404':
          description: Not found
