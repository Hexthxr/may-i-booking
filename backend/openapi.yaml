openapi: 3.0.3
info:
  title: May i Booking API
  version: 1.0.0
  description: >
    OpenAPI spec for May i Booking project.
    แบ่งหมวดตาม feature (Auth, Users, Books, Reviews, Cart, Addresses, Orders)
    และใช้ tag / x-roles เพื่อบอกว่า endpoint ไหนใช้โดย Guest / User / Admin

servers:
  - url: http://localhost:4000
    description: Local development server

tags:
  # ตามประเภทฟีเจอร์
  - name: Auth
    description: Authentication and authorization endpoints
  - name: Users
    description: User profile and favorites
  - name: Books
    description: Book catalog and admin book management
  - name: Reviews
    description: Book reviews and ratings
  - name: Cart
    description: Shopping cart for users
  - name: Addresses
    description: User address book
  - name: Orders
    description: Order placement and management

  # ตาม Role
  - name: Guest
    description: Public endpoints that don't require login
  - name: User
    description: Endpoints for logged-in users (user or admin)
  - name: Admin
    description: Endpoints that require admin role

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
        code:
          type: string
      required: [message]

    User:
      type: object
      properties:
        _id:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          type: string
          enum: [user, admin]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        displayName:
          type: string
      required: [email, password]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'

    Book:
      type: object
      properties:
        _id:
          type: string
        title:
          type: string
        authors:
          type: array
          items:
            type: string
        category:
          type: string
        description:
          type: string
        price:
          type: number
          format: float
        stock:
          type: integer
        sku:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BookCreateRequest:
      type: object
      properties:
        title:
          type: string
        authors:
          type: array
          items:
            type: string
        category:
          type: string
        description:
          type: string
        price:
          type: number
          format: float
        stock:
          type: integer
        sku:
          type: string
      required: [title, price, stock]

    Review:
      type: object
      properties:
        _id:
          type: string
        bookId:
          type: string
        userId:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ReviewCreateRequest:
      type: object
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
      required: [rating]

    RatingSummary:
      type: object
      properties:
        average:
          type: number
          format: float
        count:
          type: integer
        distribution:
          type: object
          additionalProperties:
            type: integer
      example:
        average: 4.5
        count: 12
        distribution:
          "5": 8
          "4": 3
          "3": 1

    CartItem:
      type: object
      properties:
        bookId:
          type: string
        title:
          type: string
        price:
          type: number
          format: float
        qty:
          type: integer
      required: [bookId, qty]

    Cart:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        subtotal:
          type: number
          format: float
        updatedAt:
          type: string
          format: date-time

    CartSyncRequest:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
      required: [items]

    CartAddItemRequest:
      type: object
      properties:
        bookId:
          type: string
        qty:
          type: integer
          minimum: 1
      required: [bookId, qty]

    CartRemoveItemRequest:
      type: object
      properties:
        bookId:
          type: string
      required: [bookId]

    CartUpdateQtyRequest:
      type: object
      properties:
        bookId:
          type: string
        qty:
          type: integer
          minimum: 0
      required: [bookId, qty]

    Address:
      type: object
      properties:
        _id:
          type: string
        fullName:
          type: string
        phone:
          type: string
        addressLine:
          type: string
        district:
          type: string
        province:
          type: string
        postcode:
          type: string
        isDefault:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AddressCreateRequest:
      type: object
      properties:
        fullName:
          type: string
        phone:
          type: string
        addressLine:
          type: string
        district:
          type: string
        province:
          type: string
        postcode:
          type: string
      required:
        - fullName
        - phone
        - addressLine
        - province
        - postcode

    AddressUpdateRequest:
      type: object
      properties:
        fullName:
          type: string
        phone:
          type: string
        addressLine:
          type: string
        district:
          type: string
        province:
          type: string
        postcode:
          type: string
        isDefault:
          type: boolean

    OrderItem:
      type: object
      properties:
        bookId:
          type: string
        title:
          type: string
        price:
          type: number
          format: float
        qty:
          type: integer
      required: [bookId, qty]

    Order:
      type: object
      properties:
        _id:
          type: string
        userId:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        address:
          $ref: '#/components/schemas/Address'
        paymentMethod:
          type: string
          enum: [COD, TRANSFER]
        status:
          type: string
          enum: [PENDING, PAID, PROCESSING, SHIPPED, COMPLETED, CANCELLED]
        total:
          type: number
          format: float
        slipUploaded:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OrderCreateRequest:
      type: object
      properties:
        addressId:
          type: string
        paymentMethod:
          type: string
          enum: [COD, TRANSFER]
      required: [addressId, paymentMethod]

    OrderStatusUpdateRequest:
      type: object
      properties:
        status:
          type: string
          enum: [PAID, PROCESSING, SHIPPED, COMPLETED, CANCELLED]
      required: [status]

paths:

  ################################
  #           AUTH               #
  ################################

  /api/auth/register:
    post:
      tags: [Auth, Guest]
      summary: Register a new user
      x-roles: [guest]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/login:
    post:
      tags: [Auth, Guest]
      summary: Login with email and password
      x-roles: [guest]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  ################################
  #           USERS              #
  ################################

  /api/users/me:
    get:
      tags: [Users, User]
      summary: Get current user profile
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags: [Users, User]
      summary: Update current user profile
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized

  /api/users/me/favorites:
    get:
      tags: [Users, User]
      summary: Get favorite books of current user
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      responses:
        '200':
          description: List of favorite book IDs
          content:
            application/json:
              schema:
                type: object
                properties:
                  favorites:
                    type: array
                    items:
                      type: string
    put:
      tags: [Users, User]
      summary: Replace favorite books list
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                favorites:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Updated favorites
          content:
            application/json:
              schema:
                type: object
                properties:
                  favorites:
                    type: array
                    items:
                      type: string

  /api/users/me/avatar:
    post:
      tags: [Users, User]
      summary: Upload avatar for current user
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Avatar uploaded successfully
    get:
      tags: [Users, User]
      summary: Get avatar image of current user
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      responses:
        '200':
          description: Avatar image
          content:
            image/png: {}
            image/jpeg: {}
        '404':
          description: Avatar not found

  ################################
  #           BOOKS              #
  ################################

  /api/books:
    get:
      tags: [Books, Guest, User, Admin]
      summary: Get list of books
      x-roles: [guest, user, admin]
      parameters:
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: page
          schema:
            type: integer
      responses:
        '200':
          description: List of books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'

    post:
      tags: [Books, Admin]
      summary: Create a new book (admin only)
      security:
        - BearerAuth: []
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookCreateRequest'
      responses:
        '201':
          description: Book created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          description: Invalid input
        '403':
          description: Forbidden

  /api/books/recommended:
    get:
      tags: [Books, Guest, User, Admin]
      summary: Get recommended books
      x-roles: [guest, user, admin]
      responses:
        '200':
          description: Recommended books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'

  /api/books/top-rated:
    get:
      tags: [Books, Guest, User, Admin]
      summary: Get top-rated books
      x-roles: [guest, user, admin]
      responses:
        '200':
          description: Top-rated books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'

  /api/books/best-sellers:
    get:
      tags: [Books, Guest, User, Admin]
      summary: Get best seller books
      x-roles: [guest, user, admin]
      responses:
        '200':
          description: Best seller books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'

  /api/books/{id}:
    get:
      tags: [Books, Guest, User, Admin]
      summary: Get book detail
      x-roles: [guest, user, admin]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Book detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '404':
          description: Book not found

    put:
      tags: [Books, Admin]
      summary: Update a book (admin only)
      security:
        - BearerAuth: []
      x-roles: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookCreateRequest'
      responses:
        '200':
          description: Book updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '404':
          description: Book not found

    delete:
      tags: [Books, Admin]
      summary: Delete a book (admin only)
      security:
        - BearerAuth: []
      x-roles: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Book deleted
        '404':
          description: Book not found

  /api/books/{id}/cover:
    get:
      tags: [Books, Guest, User, Admin]
      summary: Get book cover image
      x-roles: [guest, user, admin]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Book cover image
          content:
            image/png: {}
            image/jpeg: {}
        '404':
          description: Cover not found

  ################################
  #          REVIEWS             #
  ################################

  /api/books/{bookId}/reviews:
    get:
      tags: [Reviews, Guest, User, Admin]
      summary: Get reviews for a book
      x-roles: [guest, user, admin]
      parameters:
        - in: path
          name: bookId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Reviews list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Review'
    post:
      tags: [Reviews, User]
      summary: Create or update review for a book
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      parameters:
        - in: path
          name: bookId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreateRequest'
      responses:
        '201':
          description: Review created / updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '401':
          description: Unauthorized

  /api/books/{bookId}/reviews/rating:
    get:
      tags: [Reviews, Guest, User, Admin]
      summary: Get rating summary for a book
      x-roles: [guest, user, admin]
      parameters:
        - in: path
          name: bookId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Rating summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingSummary'

  /api/books/{bookId}/reviews/me:
    delete:
      tags: [Reviews, User]
      summary: Delete current user's review for a book
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      parameters:
        - in: path
          name: bookId
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Review deleted

  ################################
  #            CART              #
  ################################

  /api/cart:
    get:
      tags: [Cart, User]
      summary: Get current user's cart
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      responses:
        '200':
          description: Current cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
    post:
      tags: [Cart, User]
      summary: Sync entire cart items
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartSyncRequest'
      responses:
        '200':
          description: Cart synced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
    delete:
      tags: [Cart, User]
      summary: Clear cart
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      responses:
        '204':
          description: Cart cleared

  /api/cart/items:
    post:
      tags: [Cart, User]
      summary: Add item to cart
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartAddItemRequest'
      responses:
        '200':
          description: Item added to cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
    delete:
      tags: [Cart, User]
      summary: Remove item from cart
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartRemoveItemRequest'
      responses:
        '200':
          description: Item removed from cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'

  /api/cart/qty:
    put:
      tags: [Cart, User]
      summary: Update quantity of cart item
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartUpdateQtyRequest'
      responses:
        '200':
          description: Quantity updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'

  ################################
  #          ADDRESSES           #
  ################################

  /api/addresses:
    get:
      tags: [Addresses, User]
      summary: Get all addresses of current user
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      responses:
        '200':
          description: Address list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Address'
    post:
      tags: [Addresses, User]
      summary: Create new address for current user
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressCreateRequest'
      responses:
        '201':
          description: Address created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'

  /api/addresses/{id}:
    get:
      tags: [Addresses, User]
      summary: Get single address by id
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Address detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '404':
          description: Address not found
    patch:
      tags: [Addresses, User]
      summary: Update address
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressUpdateRequest'
      responses:
        '200':
          description: Address updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '404':
          description: Address not found
    delete:
      tags: [Addresses, User]
      summary: Delete address
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Address deleted
        '404':
          description: Address not found

  /api/addresses/{id}/default:
    patch:
      tags: [Addresses, User]
      summary: Set address as default
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Default address set
        '404':
          description: Address not found

  ################################
  #            ORDERS            #
  ################################

  /api/orders:
    post:
      tags: [Orders, User]
      summary: Create new order from current cart
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
    get:
      tags: [Orders, User]
      summary: Get orders of current user
      security:
        - BearerAuth: []
      x-roles: [user, admin]
      responses:
        '200':
          description: Orders list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'

  /api/orders/admin:
    get:
      tags: [Orders, Admin]
      summary: Get all orders (admin only)
      security:
        - BearerAuth: []
      x-roles: [admin]
      parameters:
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: userId
          schema:
            type: string
      responses:
        '200':
          description: Orders list (admin)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '403':
          description: Forbidden

  /api/orders/{id}:
    get:
      tags: [Orders, User, Admin]
      summary: Get order detail by id
      security:
        - BearerAuth: []
